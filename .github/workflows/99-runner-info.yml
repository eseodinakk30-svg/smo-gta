# Временный диагностический workflow: ставит Unity с модулем Android и, что бы
# ни случилось, выкладывает СОБСТВЕННЫЙ лог Unity Hub и список того, что реально
# оказалось на диске. Голое "Installation Failed" в выводе экшена причины не
# называет — она в логе Hub. Удалить, когда сборка APK заработает.
name: "99. Диагностика раннера"

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Что лежит в SDK раннера
        run: |
          SDK=/usr/local/lib/android/sdk
          for d in build-tools platforms platform-tools cmdline-tools ndk; do
            echo "--- $d ---"; ls "$SDK/$d" 2>/dev/null || echo "нет"
          done

      - name: Поставить Unity Hub и починить путь к нему
        uses: ./.github/actions/unity-hub

      - name: Установить Unity с модулем Android
        id: setup
        continue-on-error: true
        uses: buildalon/unity-setup@v2
        with:
          version-file: ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: false

      - name: Настоящая причина из лога Unity Hub
        if: always()
        run: |
          echo "=== итог шага установки: ${{ steps.setup.outcome }} ==="
          for f in "$HOME/.config/UnityHub/logs/info-log.json" \
                   "$HOME/.config/Unity Hub/logs/info-log.json"; do
            [ -f "$f" ] || continue
            echo "=== $f (строки со сбоем) ==="
            grep -i -E "error|fail|denied|exists|rename|extract|EACCES|ENOENT" "$f" \
              | tail -40
          done
          echo "=== все логи Hub, какие есть ==="
          find "$HOME/.config" -iname "*.json" -path "*ogs*" 2>/dev/null | head

      - name: Что реально установилось в Unity
        if: always()
        run: |
          AP=/home/runner/Unity/Hub/Editor/2022.3.62f1/Editor/Data/PlaybackEngines/AndroidPlayer
          echo "--- AndroidPlayer ---"; ls "$AP" 2>/dev/null || echo "нет AndroidPlayer"
          echo "--- SDK Unity ---";     ls "$AP/SDK" 2>/dev/null || echo "нет SDK"
          echo "--- build-tools ---";   ls "$AP/SDK/build-tools" 2>/dev/null || echo "нет build-tools"
          echo "--- platforms ---";     ls "$AP/SDK/platforms" 2>/dev/null || echo "нет platforms"
          echo "--- NDK ---";           ls "$AP/NDK" 2>/dev/null | head -5 || echo "нет NDK"
          echo "--- OpenJDK ---";       ls "$AP/OpenJDK" 2>/dev/null | head -5 || echo "нет OpenJDK"
