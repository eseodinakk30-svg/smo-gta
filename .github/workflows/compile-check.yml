name: Compile Check

# Type-checks every runtime script against a stand-in for the Unity API, so
# broken code is caught in seconds without needing a Unity licence.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Type-check every runtime script
        run: dotnet build tools/compilecheck/CompileCheck.csproj -v q --nologo
